name: Release

on:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Build & Test
        run: ./gradlew test _oriMixin loaderJar -Prelease --no-build-cache

      - name: Publish
        run: ./gradlew publish pluginPublish -Prelease --no-build-cache --githubReleaseId ${{ github.event.release.id }}
        env:
          ORG_GRADLE_PROJECT_xenondevsUsername: ${{ secrets.XENONDEVS_RELEASES_USERNAME }}
          ORG_GRADLE_PROJECT_xenondevsPassword: ${{ secrets.XENONDEVS_RELEASES_PASSWORD }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
          DISCORD_WEBHOOK_TOKEN: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_API_KEY: ${{ secrets.HANGAR_API_KEY }}

  docs:
    name: Publish API documentation
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Generate API documentation
        run: ./gradlew dokkaGenerate --build-cache

      - name: Deploy to Github Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: build/dokka/html/
